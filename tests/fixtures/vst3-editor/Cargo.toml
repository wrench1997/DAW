[package]
name = "citrus-vst3-editor-fixture"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Source-only developer acceptance fixture; never shipped with Citrus Studio"

[lib]
crate-type = ["cdylib"]

# This fixture is intentionally not a Citrus workspace member or app dependency.
[workspace]

[features]
default = []
no-editor = []

[dependencies]
vst3 = "=0.3.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "=0.3.9", features = ["winuser", "libloaderapi"] }
