name: Rust quality checks

on:
  push:
    branches: [main, ci/windows-reliability-20261009]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Development checks use Windows MSVC. They do not produce or attest the
# separately documented, pinned Windows gnullvm release package.
jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare stable MSVC development toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy

      - name: Record compiler and dependency inputs
        run: |
          rustc +stable-x86_64-pc-windows-msvc --version --verbose
          cargo +stable-x86_64-pc-windows-msvc --version --verbose
          Get-FileHash Cargo.lock -Algorithm SHA256

      - name: Check formatting
        run: cargo +stable-x86_64-pc-windows-msvc fmt --all -- --check

      # Root cargo test does not run dependency unit tests. These factory and
      # mock-child checks use no installed plug-in, GUI or audio device.
      - name: Run retained factory metadata regressions
        timeout-minutes: 10
        run: cargo +stable-x86_64-pc-windows-msvc test --locked --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --lib factory --target-dir target -- --test-threads=1

      - name: Run offline MIDI process-boundary regressions
        timeout-minutes: 5
        run: cargo +stable-x86_64-pc-windows-msvc test --locked --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --lib offline_midi --target-dir target -- --test-threads=1

      - name: Run async-state readiness regressions
        timeout-minutes: 5
        run: cargo +stable-x86_64-pc-windows-msvc test --locked --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --features experimental-fresh-helper --lib async_state_readiness --target-dir target -- --test-threads=1

      - name: Run strict stereo Effect and borrowed PCM regressions
        timeout-minutes: 5
        run: cargo +stable-x86_64-pc-windows-msvc test --locked --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --features experimental-fresh-helper --lib effect_ --target-dir target -- --test-threads=1

      - name: Run locked all-feature tests
        run: cargo +stable-x86_64-pc-windows-msvc test --locked --all-features --all-targets

      - name: Check Clippy warnings
        run: cargo +stable-x86_64-pc-windows-msvc clippy --locked --all-features --all-targets -- -D warnings

      - name: Build application and VST3 helper
        run: cargo +stable-x86_64-pc-windows-msvc build --locked --all-features --bins

      - name: Verify real no-GUI stereo Effect through production helper
        timeout-minutes: 10
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --locked --jobs 1 --manifest-path tests/fixtures/vst3-effect/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/fixtures/vst3-effect/build_fixture.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CITRUS_EFFECT_FIXTURE = (Resolve-Path tests/fixtures/vst3-effect/target/bundles/CitrusStereoDelayFixture.vst3).Path
          $env:CITRUS_EFFECT_HELPER = (Resolve-Path target/debug/vst3-host-helper.exe).Path
          cargo test --locked --jobs 1 --manifest-path tests/fixtures/vst3-effect/host-check/Cargo.toml --target-dir target --test real_effect real_sdk_effect_pcm_state_transport_delay_tail_and_natural_reap -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Python is supplied by the hosted Windows runner and used only for QA.
      - name: Record smoke harness interpreter
        run: python --version

      - name: Test helper smoke harness
        timeout-minutes: 2
        run: python -B -m unittest discover -s scripts -p "test_smoke_vst3_helper.py" -v

      - name: Test native editor protocol harness (no GUI claim)
        timeout-minutes: 2
        run: python -B -m unittest discover -s scripts -p "test_smoke_vst3_editor.py" -v

      - name: Check source-only native editor fixture
        run: cargo +stable-x86_64-pc-windows-msvc clippy --locked --manifest-path tests/fixtures/vst3-editor/Cargo.toml --all-features --all-targets -- -D warnings

      - name: Smoke test built VST3 helper protocol
        timeout-minutes: 1
        run: python -B scripts/smoke_vst3_helper.py target/debug/vst3-host-helper.exe --timeout 5

      - name: Check internal-only feature configuration
        run: cargo +stable-x86_64-pc-windows-msvc check --locked --no-default-features --all-targets

      - name: Build and verify trusted native editor fixtures
        timeout-minutes: 10
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
          CARGO_NET_OFFLINE: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # The earlier locked fixture Clippy step supplies registry dependencies.
          # Build only checked-in MIT source, without a download/install fallback.
          python -B tests/fixtures/vst3-editor/build_fixture.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import hashlib
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from smoke_vst3_editor import FIXTURE_ROOT, require, verify_fixture
          helper = Path('target/debug/vst3-host-helper.exe').resolve()
          require(helper.is_file(), f'Built production helper is missing: {helper}')
          print(f'Production helper SHA256: {hashlib.sha256(helper.read_bytes()).hexdigest()}')
          owned = (FIXTURE_ROOT / 'target' / 'bundles').resolve()
          require(owned.is_relative_to(FIXTURE_ROOT.resolve()), 'Fixture build directory escaped checked-in source root')
          for variant in ('editor', 'no-editor'):
              bundle = verify_fixture(FIXTURE_ROOT, variant)
              require(bundle.parent == owned, 'Fixture bundle escaped the owned build directory')
              receipt = json.loads((bundle / 'source-build.json').read_text(encoding='utf-8'))
              require(receipt['target'] == 'x86_64-pc-windows-msvc', 'Fixture/helper target mismatch')
              print(f'Verified {variant}: {bundle}; SHA256 {receipt["binary_sha256"]}')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native fixture editor lifecycle, state and stdout checks
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # Four helper sessions each have a 60-second deadline. The harness kills
          # and reaps failed helpers/capture children and destroys its own HWNDs.
          # Desktop preflight and each real PrintWindow capture have 5-second limits.
          python -B scripts/smoke_vst3_editor.py --helper target/debug/vst3-host-helper.exe --timeout 60 --summary "$env:GITHUB_STEP_SUMMARY"
          $code = $LASTEXITCODE
          if ($code -eq 77) {
            Write-Output '::notice::SKIPPED PrintWindow/native editor: environment unsupported; exact desktop facts and reason are in the Summary.'
            exit 0
          }
          if ($code -ne 0) {
            "| FAIL | native harness process | Exited $code; see the failing assertion or interpreter diagnostic above. |" >> $env:GITHUB_STEP_SUMMARY
            exit $code
          }
          "Scope: fixture-only automated evidence. Human visual review, real vendor plugins, physical input/audio devices, DPI transitions and release acceptance remain NOT VERIFIED." >> $env:GITHUB_STEP_SUMMARY

  linux-helper-readiness:
    # Narrow no-GUI SDK lane: readiness/no-respawn and a checked-in test Effect.
    # No DAW, installed plug-in, desktop or audio device is used.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare stable Rust and SDK build dependencies
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxcb1-dev libxcb-util-dev

      - name: Run SDK async-state readiness regressions
        run: cargo +stable test --locked --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --features experimental-fresh-helper --lib async_state_readiness --target-dir target -- --test-threads=1

      - name: Run strict stereo Effect and borrowed PCM regressions
        timeout-minutes: 5
        run: cargo +stable test --locked --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --features experimental-fresh-helper --lib effect_ --target-dir target -- --test-threads=1

      - name: Preserve Unix ordinary-isolation no-respawn contract
        run: cargo +stable test --locked --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --features experimental-fresh-helper --lib internal::isolated_plugin_impl::tests::checked_native_operations_never_respawn_a_dead_instance --target-dir target -- --exact --test-threads=1

      - name: Verify real no-GUI stereo Effect through production helper
        timeout-minutes: 10
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          cargo test --locked --jobs 1 --manifest-path tests/fixtures/vst3-effect/Cargo.toml
          python3 -B tests/fixtures/vst3-effect/build_fixture.py --target x86_64-unknown-linux-gnu
          cargo build --locked --jobs 1 --manifest-path vendor/vst3-host-0.9.0/Cargo.toml --no-default-features --features experimental-fresh-helper --bin vst3-host-helper --target-dir target
          export CITRUS_EFFECT_FIXTURE="$(realpath tests/fixtures/vst3-effect/target/bundles/CitrusStereoDelayFixture.vst3)"
          export CITRUS_EFFECT_HELPER="$(realpath target/debug/vst3-host-helper)"
          cargo test --locked --jobs 1 --manifest-path tests/fixtures/vst3-effect/host-check/Cargo.toml --target-dir target --test real_effect real_sdk_effect_pcm_state_transport_delay_tail_and_natural_reap -- --ignored --exact --nocapture
